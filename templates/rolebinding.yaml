{{- if and .Values.rbac.create .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bank-app.fullname" . }}-rolebinding
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bank-app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bank-app.fullname" . }}-role
{{- end }}
