{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bank-app-rolebinding
  labels:
    app: bank-app
subjects:
  - kind: ServiceAccount
    name: bank-app-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bank-app-role
{{- end }}
