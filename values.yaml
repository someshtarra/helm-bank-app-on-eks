# Replica & Container Image
replicaCount: 2

image:
  repository: someshtarra/httpd
  tag: "fox-3D"
  pullPolicy: IfNotPresent

# Service & Load Balancer
service:
  type: LoadBalancer
  port: 80
  targetPort: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"

# CPU & Memory Resources (Required for HPA)
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Horizontal Pod Autoscaler (HPA v2)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

# Storage (AWS EBS gp3)
storage:
  enabled: true
  storageClassName: "ebs-gp3-sc"
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  mountPath: /var/www/html/
  storageClass:
    create: true
    provisioner: ebs.csi.aws.com
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Retain
    parameters:
      type: gp3
      fsType: ext4

# Security Context (Non-root UID 10001)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ServiceAccount & RBAC (Least Privilege)
serviceAccount:
  create: true
  automountServiceAccountToken: false

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list"]

# High Availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Scheduling: Tolerations & Node Affinity
tolerations:
  - key: dedicated
    operator: Equal
    value: frontend
    effect: NoSchedule

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
